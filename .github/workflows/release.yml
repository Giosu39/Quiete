name: Release

# Pubblica una release con l'APK allegato ogni volta che si crea un tag "v*" (es. v1.0.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "QUIETE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 not set, the APK will be signed with a temporary debug key."
          fi

      - name: Build APK
        env:
          QUIETE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QUIETE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QUIETE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Quiete-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: Quiete-*.apk
          generate_release_notes: true
